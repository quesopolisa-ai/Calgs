<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #viewer { width: 100%; height: 100%; border: none; display: block; background: #fff; }
        #controls {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(20,20,20,0.9); padding: 10px 16px;
            display: flex; gap: 10px; align-items: center; z-index: 100;
            transition: transform 0.5s ease; transform: translateY(0);
        }
        #controls.hidden { transform: translateY(-100%); }
        #toggleBtn {
            position: fixed; top: 10px; right: 10px; z-index: 101;
            background: rgba(30,30,30,0.8); color: #ddd; border: none;
            border-radius: 50%; width: 40px; height: 40px; font-size: 20px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.3s ease;
        }
        #toggleBtn:hover { background: rgba(50,50,50,0.9); }
        #urlInput {
            flex: 1; background: #2a2a2a; color: #eee; border: 1px solid #444;
            padding: 10px 14px; border-radius: 6px; font-size: 15px; min-width: 200px;
        }
        #urlInput:focus { outline: none; border-color: #888; }
        #goBtn {
            background: #3a6ea5; color: #fff; border: none; padding: 10px 20px;
            border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: 500;
        }
        #goBtn:hover { background: #4a7eb5; }
        #status { font-size: 12px; color: #aaa; white-space: nowrap; }
    </style>
</head>
<body>
    <iframe id="viewer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"></iframe>
    <div id="controls">
        <input type="text" id="urlInput" placeholder="Enter URL to fetch..." value="https://example.com" />
        <button id="goBtn">Go</button>
        <span id="status">Ready</span>
    </div>
    <button id="toggleBtn" title="Toggle controls">⌕</button>

    <script>
        const PROXY = "https://dogeub-challenge.fly.dev";

        const urlInput = document.getElementById('urlInput');
        const goBtn = document.getElementById('goBtn');
        const viewer = document.getElementById('viewer');
        const status = document.getElementById('status');
        const controls = document.getElementById('controls');
        const toggleBtn = document.getElementById('toggleBtn');

        function loadUrl() {
            let targetUrl = urlInput.value.trim();
            if (!targetUrl) return;
            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }
            const proxyUrl = PROXY + '/?url=' + encodeURIComponent(targetUrl);
            status.textContent = 'Loading...';
            viewer.src = proxyUrl;
            viewer.onload = () => { status.textContent = 'Done'; };
            viewer.onerror = () => { status.textContent = 'Error'; };
        }

        goBtn.addEventListener('click', loadUrl);
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loadUrl();
        });

        toggleBtn.addEventListener('click', () => {
            controls.classList.toggle('hidden');
        });

        // Auto-hide controls after 20 seconds
        setTimeout(() => {
            controls.classList.add('hidden');
        }, 20000);
    </script>
</body>
</html>

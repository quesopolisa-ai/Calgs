<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #toolbar {
            background: #1a1a1a;
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
            flex-wrap: wrap;
        }
        #toolbar select {
            background: #252525;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            min-width: 280px;
            cursor: pointer;
        }
        #toolbar select:focus {
            outline: none;
            border-color: #666;
        }
        #urlInput {
            flex: 1;
            background: #252525;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            min-width: 200px;
        }
        #urlInput:focus {
            outline: none;
            border-color: #666;
        }
        #goBtn {
            background: #3a6ea5;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        #goBtn:hover {
            background: #4a7eb5;
        }
        #randomBtn {
            background: #555;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        #randomBtn:hover {
            background: #666;
        }
        #status {
            font-size: 12px;
            color: #999;
            margin-left: auto;
        }
        #frameContainer {
            flex: 1;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 13, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #ccc;
            z-index: 10;
        }
        #loading.show {
            display: flex;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <select id="proxySelect">
            <option value="">-- Select Worker Proxy --</option>
        </select>
        <input type="text" id="urlInput" placeholder="Enter URL to fetch..." value="https://example.com" />
        <button id="goBtn">Go</button>
        <button id="randomBtn">Random Proxy</button>
        <span id="status">Ready</span>
    </div>
    <div id="frameContainer">
        <iframe id="viewer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"></iframe>
        <div id="loading">Loading through proxy...</div>

            "https://rzs05lsdi9h.braylonlynn57.workers.dev"
        ];

        const select = document.getElementById('proxySelect');
        const urlInput = document.getElementById('urlInput');
        const goBtn = document.getElementById('goBtn');
        const randomBtn = document.getElementById('randomBtn');
        const viewer = document.getElementById('viewer');
        const loading = document.getElementById('loading');
        const status = document.getElementById('status');

        // Populate dropdown
        proxies.forEach((proxy, i) => {
            const opt = document.createElement('option');
            opt.value = proxy;
            opt.textContent = `Worker ${i + 1} — ${proxy.replace('https://', '')}`;
            select.appendChild(opt);
        });

        function getSelectedProxy() {
            return select.value || proxies[Math.floor(Math.random() * proxies.length)];
        }

        function loadUrl() {
            const proxy = getSelectedProxy();
            let targetUrl = urlInput.value.trim();
            if (!targetUrl) return;
            
            // Add https:// if missing
            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }

            // Construct proxy URL — workers typically accept ?url= param or path
            const proxyUrl = proxy + '/?url=' + encodeURIComponent(targetUrl);
            
            loading.classList.add('show');
            status.textContent = 'Loading via ' + proxy.replace('https://', '');
            
            viewer.onload = () => {
                loading.classList.remove('show');
                status.textContent = 'Loaded: ' + targetUrl;
            };
            viewer.onerror = () => {
                loading.classList.remove('show');
                status.textContent = 'Error loading ' + targetUrl;
            };
            
            viewer.src = proxyUrl;
        }

        goBtn.addEventListener('click', loadUrl);
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loadUrl();
        });
        randomBtn.addEventListener('click', () => {
            const randomProxy = proxies[Math.floor(Math.random() * proxies.length)];
            select.value = randomProxy;
            status.textContent = 'Selected: ' + randomProxy.replace('https://', '');
            loadUrl();
        });

        // Auto-select random proxy on load
        select.value = proxies[Math.floor(Math.random() * proxies.length)];
        status.textContent = 'Ready — using ' + select.value.replace('https://', '');
